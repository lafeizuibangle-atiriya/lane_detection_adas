[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adas"
version = "0.1.0"
description = "车道线识别与行人避障：针孔投影 + 米制鸟瞰 + 滑窗拟合 + TTC 分级告警"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.9,<5",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "scipy>=1.11",
    "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
adas = "adas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# 真实配置在 pytest.ini，这里只声明测试目录，避免 IDE 找不到
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src/adas"]
omit = ["src/adas/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
